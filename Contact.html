<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Gabriel Babalola</title>
     <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>Contact Me</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>

    <hr>

    <main>

        <section>

            <h2>Get In Touch</h2>

            <p>
                If you have a project, job opportunity or any question,
                feel free to contact me using the form below.
            </p>

        </section>

        <hr>

        <div>

            <h2>Contact Form</h2>

            <form action="mailto:your-email@example.com"
                  method="post"
                  enctype="text/plain">

                <label for="name">Full Name:</label>
                <br>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

                <br><br>

                <label for="email">Email Address:</label>
                <br>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <br><br>

                <label for="subject">Subject:</label>
                <br>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="Enter subject"
                    required
                >

                <br><br>

                <label for="message">Message:</label>
                <br>

                <textarea
                    id="message"
                    name="message"
                    rows="8"
                    cols="40"
                    placeholder="Write your message here"
                    required
                ></textarea>

                <br><br>

                <button type="submit">
                    Send Message
                </button>
                

            </form>
            
            

        </div>

        <hr>

        <section>

            <h2>Contact Information</h2>

            <p>
                <strong>Email:</strong>
                your-email@example.com
            </p>

            <p>
                <strong>Location:</strong>
                Nigeria
            </p>

        </section>

    </main>

    <hr>

    </footer>

</body>

</html>
